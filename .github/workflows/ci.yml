name: CI - Generate & Run NUnit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-generation-and-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate NUnit tests
        run: python generator/gen_tests.py --config config.yaml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        run: dotnet build tests/Module.Tests/Module.Tests.csproj --configuration Release

      - name: Run Tests
        run: dotnet test tests/Module.Tests/Module.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --verbosity normal
